name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  checks:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Pin exact npm 11.5.1
        run: |
          runtime_node_dir="$(dirname "$(command -v node)")"
          npm install --prefix "$runtime_node_dir" --ignore-scripts npm@11.5.1
          actual_npm_version="$("$runtime_node_dir/node" "$runtime_node_dir/node_modules/npm/bin/npm-cli.js" --version)"
          if [ "$actual_npm_version" != "11.5.1" ]; then
            echo "::error::Expected npm 11.5.1 but found ${actual_npm_version}"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Wallet dependency peer integrity
        run: npm run proof:wallet-deps

      - name: Production dependency audit
        run: npm run proof:deps

      - name: All dependency audit
        run: npm run proof:deps:all

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Business logic tests
        run: npm run test:logic

      - name: P1 hardening suites (including EVM)
        run: npm run test:p1-hardening:all

      - name: P1 performance harness self-test
        run: npm run perf:p1:self-test

      - name: Contract invariants (V10)
        run: npm run test:contract:v10

      - name: Contract compilation provenance (V10)
        run: npm run proof:contract-compile:v10

      - name: Indexer storage tests
        run: npm run test:indexer-storage:summary

      - name: SQLite operational tests
        run: npm run test:db-operations

      - name: Runtime monitoring drill
        run: npm run test:monitoring

      - name: Build
        run: npm run build

      - name: Production browser smoke
        env:
          LORE_DB_PATH: .tmp/ci-runtime.sqlite
          SMOKE_BASE_URL: http://127.0.0.1:3001
          SMOKE_BROWSER_EXECUTABLE: /usr/bin/google-chrome
          SMOKE_INCLUDE_DEBUG_AUTOMINER_SCENARIOS: "1"
          ALLOW_WEAK_RATE_LIMIT_IDENTITY: "1"
        run: |
          mkdir -p .tmp
          npm run start > .tmp/ci-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          npm run smoke:browser

      - name: Upload compilation provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: contract-compilation-provenance
          path: |
            .tmp/contract-compilation-provenance-v10.json
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true

  checks-windows:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Pin exact npm 11.5.1
        shell: bash
        run: |
          runtime_node_dir="$(dirname "$(command -v node)")"
          npm install --prefix "$runtime_node_dir" --ignore-scripts npm@11.5.1
          actual_npm_version="$("$runtime_node_dir/node" "$runtime_node_dir/node_modules/npm/bin/npm-cli.js" --version)"
          if [ "$actual_npm_version" != "11.5.1" ]; then
            echo "::error::Expected npm 11.5.1 but found ${actual_npm_version}"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Wallet dependency peer integrity
        run: npm run proof:wallet-deps:summary

      - name: CI workflow security
        run: npm run proof:ci-security:summary

      - name: Lint
        run: npm run lint:summary

      - name: Typecheck
        run: npm run typecheck:summary

      - name: Business logic tests
        run: npm run test:logic:summary

      - name: P1 hardening suites (compact)
        run: npm run test:p1-hardening:summary

      - name: P1 performance harness self-test
        run: npm run perf:p1:self-test

      - name: Contract invariants (V10)
        run: npm run test:contract:v10:summary

      - name: Contract compilation provenance (V10)
        run: npm run proof:contract-compile:v10:summary

      - name: Indexer storage tests
        run: npm run test:indexer-storage:summary

      - name: SQLite operational tests
        run: npm run test:db-operations:summary

      - name: Runtime monitoring drill
        run: npm run test:monitoring:summary

      - name: Build
        run: npm run build:summary

      - name: Upload compilation provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: contract-compilation-provenance-windows
          path: |
            .tmp/contract-compilation-provenance-v10.json
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true

  dependency-audit:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Pin exact npm 11.5.1
        run: |
          runtime_node_dir="$(dirname "$(command -v node)")"
          npm install --prefix "$runtime_node_dir" --ignore-scripts npm@11.5.1
          actual_npm_version="$("$runtime_node_dir/node" "$runtime_node_dir/node_modules/npm/bin/npm-cli.js" --version)"
          if [ "$actual_npm_version" != "11.5.1" ]; then
            echo "::error::Expected npm 11.5.1 but found ${actual_npm_version}"
            exit 1
          fi

      - name: Install dependencies
        id: dependency_install
        run: npm ci

      - name: Production dependency audit
        if: ${{ always() && steps.dependency_install.outcome == 'success' }}
        shell: bash
        run: |
          mkdir -p .tmp
          npm --silent run proof:deps:summary | tee .tmp/dependency-audit-production.json

      - name: All dependency audit
        if: ${{ always() && steps.dependency_install.outcome == 'success' }}
        shell: bash
        run: |
          mkdir -p .tmp
          npm --silent run proof:deps:all:summary | tee .tmp/dependency-audit-all.json

      - name: Upload dependency audit summaries
        if: ${{ always() && steps.dependency_install.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-audit-summaries
          path: |
            .tmp/dependency-audit-production.json
            .tmp/dependency-audit-all.json
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
