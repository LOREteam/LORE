name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wallet dependency peer integrity
        run: npm run proof:wallet-deps

      - name: Production dependency audit
        run: npm run proof:deps

      - name: All dependency audit
        run: npm run proof:deps:all

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Business logic tests
        run: npm run test:logic

      - name: Contract invariants (V9 and V10)
        run: |
          npm run test:contract
          npm run test:contract:v10

      - name: Contract compilation provenance (V9 and V10)
        run: |
          npm run proof:contract-compile
          npm run proof:contract-compile:v10

      - name: SQLite operational tests
        run: npm run test:db-operations

      - name: Runtime monitoring drill
        run: npm run test:monitoring

      - name: Build
        run: npm run build

      - name: Production browser smoke
        env:
          LORE_DB_PATH: .tmp/ci-runtime.sqlite
          SMOKE_BASE_URL: http://127.0.0.1:3001
          SMOKE_BROWSER_EXECUTABLE: /usr/bin/google-chrome
          SMOKE_INCLUDE_DEBUG_AUTOMINER_SCENARIOS: "1"
          ALLOW_WEAK_RATE_LIMIT_IDENTITY: "1"
        run: |
          mkdir -p .tmp
          npm run start > .tmp/ci-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          npm run smoke:browser

      - name: Upload compilation provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: contract-compilation-provenance
          path: |
            .tmp/contract-compilation-provenance.json
            .tmp/contract-compilation-provenance-v10.json
          if-no-files-found: error
